<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    .toggle-btn {
      background: transparent;
      color: #007bff;
      margin-top: 15px;
      font-size: 14px;
    }
    .toggle-btn:hover {
      background: transparent;
      text-decoration: underline;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- SIGNUP FORM -->
    <div id="signup-box">
      <h2>Naya Account Banayein</h2>
      <div class="form-group">
        <label>Naam</label>
        <input type="text" id="signup-name" placeholder="Apna naam daalein">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="Apna email daalein">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Password set karein">
      </div>
      <button id="btn-signup">Register Karein</button>
      <button class="toggle-btn" onclick="showLogin()">Pehle se account hai? Login karein</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-box" class="hidden">
      <h2>Login Karein</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="Email daalein">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Password daalein">
      </div>
      <button id="btn-login">Login Karein</button>
      <button class="toggle-btn" onclick="showSignup()">Naya account banayein</button>
    </div>
  </div>

  <!-- FIREBASE SDKs & AUTHENTICATION CODE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Aapki Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDlYDBAqR7MjzwwA8lolIM36MAGmP6Ftsc",
      authDomain: "all-data-5e719.firebaseapp.com",
      projectId: "all-data-5e719",
      storageBucket: "all-data-5e719.firebasestorage.app",
      messagingSenderId: "910839520941",
      appId: "1:910839520941:web:993a3451c4c29b5b017024",
      measurementId: "G-P8GXQMZLZ7"
    };

    // Firebase App Initialize
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // HTML References
    const signupBox = document.getElementById('signup-box');
    const loginBox = document.getElementById('login-box');

    // UI Toggle Functions
    window.showLogin = () => {
      signupBox.classList.add('hidden');
      loginBox.classList.remove('hidden');
    };
    window.showSignup = () => {
      loginBox.classList.add('hidden');
      signupBox.classList.remove('hidden');
    };

    // 1. SIGNUP FUNCTION
    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      if (!email || !password) {
        alert("Kripya email aur password dono bharein!");
        return;
      }

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert("Account successfully ban gaya hai!");
        window.location.href = "home.html"; 
      } catch (error) {
        alert("Error: " + error.message);
      }
    });

    // 2. LOGIN FUNCTION
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        alert("Kripya email aur password bharein!");
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful!");
        window.location.href = "home.html"; 
      } catch (error) {
        alert("Error: " + error.message);
      }
    });

    // 3. AUTH STATE LISTEN (Agar user pehle se logged-in hai toh home.html par bhejo)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "home.html";
      }
    });
  </script>

</body>
</html>
